# Configuración optimizada para Ryzen 9 8940HX (16 Cores / 32 Threads) y 32GB RAM
org.gradle.jvmargs=-Xmx10g -XX:+UseG1GC -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Ejecución paralela y máxima concurrencia en los 16 núcleos / 32 hilos
org.gradle.parallel=true
org.gradle.workers.max=24

# Caché y optimizaciones de compilación
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch-fs=true

# Optimizaciones de Android y Kotlin
android.nonTransitiveRClass=true
android.defaults.buildFeatures.resValues=false
android.enableJetifier=false
kotlin.incremental=true
kotlin.code.style=official

# Sincronización paralela
org.gradle.tooling.parallel=true
